name: apk
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: |
          sed -i "s#'libs'#'libs', '../../node_modules/@capacitor/background-runner/android/src/main/libs'#" android/app/build.gradle
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n "background-runner" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: atmoz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
