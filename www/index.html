<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<title>Atmoz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#070d24;--card:#101a3d;--card2:#18265a;--tx:#eaf0ff;--mut:#8b9acb;--ac:#5aa9ff;--warn:#ffb347;--bad:#ff6b7a;--ok:#5be3a8}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--s1,#0c1744),var(--s2,#070d24)) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;padding:16px 16px calc(92px + env(safe-area-inset-bottom,0))}
.tab{display:none}.tab.on{display:block}
.card{background:rgba(14,24,60,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:.85rem}
h2{font-size:1.05rem;font-weight:600;margin:4px 2px 10px}
.bar{display:flex;gap:8px;margin-bottom:14px}
.bar input{flex:1;min-width:0;background:var(--card);border:0;border-radius:16px;padding:12px 14px;color:var(--tx);font-size:1rem}
.bar button,.pill{background:var(--card2);border:0;border-radius:16px;color:var(--tx);padding:0 14px;font-size:1.1rem;min-height:44px}
.hero{text-align:center;padding:26px 16px 22px;background:rgba(255,255,255,.07)}
.hero .place{font-size:1.15rem;font-weight:600}
.hero .ico{font-size:5rem;line-height:1.1;margin:8px 0 0;filter:drop-shadow(0 6px 22px rgba(140,190,255,.45))}
.hero .t{font-size:5.2rem;font-weight:200;line-height:1;letter-spacing:-2px}
.hero .d{font-size:1.1rem;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}
.k{font-size:.8rem;color:var(--mut)}
.v{font-size:1.5rem;font-weight:600;margin-top:4px}
.v small{font-size:.8rem;font-weight:400;color:var(--mut)}
.hours{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 -4px 12px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.h{flex:0 0 68px;background:rgba(14,24,60,.5);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 6px;text-align:center}
.h b{display:block;font-size:1.05rem;margin:4px 0 2px}
.h .e{font-size:1.6rem}
.h .p{font-size:.72rem;color:var(--ac)}
.day{display:grid;grid-template-columns:86px 34px 44px 1fr;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1d2b63}
.day:last-child{border:0}
.rng{display:flex;align-items:center;gap:8px;font-size:.9rem}
.rng i{flex:1;height:5px;border-radius:5px;background:linear-gradient(90deg,#5aa9ff,#ffb347)}
.al{border-left:5px solid var(--warn);display:flex;gap:12px}
.al.r{border-color:var(--bad)}.al.i{border-color:var(--ok)}
.al .e{font-size:1.6rem}
#map{height:calc(100vh - 250px);min-height:300px;border-radius:22px;overflow:hidden;background:var(--card)}
.leaflet-container{background:#0b1334}
#banner{display:none;background:#3a2a10;color:#ffd9a0;border-radius:18px;padding:12px 14px;margin-bottom:12px;font-size:.95rem}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0));background:#0e1838ee;backdrop-filter:blur(14px);border-radius:26px;display:flex;padding:6px;z-index:999;box-shadow:0 8px 30px #0008}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;border-radius:20px;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.35rem}
nav button.on{background:var(--card2);color:var(--tx)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
</style>
<style>
/* Thème Atmoz : bleu électrique, marine profond, lueurs néon */
:root{--bg:#050b24;--card:#0e1840;--card2:#16316f;--tx:#eaf4ff;--mut:#8fa6d6;--ac:#3d9bff}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",system-ui,sans-serif}
.brand{display:flex;align-items:center;gap:12px;margin:2px 2px 14px}
.brand img{width:46px;height:46px;border-radius:13px;box-shadow:0 0 0 1px rgba(120,190,255,.55),0 0 18px rgba(47,140,255,.55)}
.wm{font-size:2rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(180deg,#fff 10%,#8fd0ff 55%,#2f8cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #04122e) drop-shadow(0 0 10px rgba(47,140,255,.7))}
.card,.h{background:linear-gradient(160deg,rgba(20,38,92,.66),rgba(6,12,38,.66));border:1px solid rgba(90,170,255,.28);box-shadow:0 0 0 1px rgba(4,8,26,.6) inset,0 6px 26px rgba(20,90,255,.14)}
.hero{background:radial-gradient(90% 70% at 50% 0,rgba(47,140,255,.3),rgba(6,12,38,.7))}
.hero .place{font-weight:700;letter-spacing:.3px}
.hero .ico{filter:drop-shadow(0 0 22px rgba(80,170,255,.7))}
.hero .t{font-weight:700;letter-spacing:-3px;background:linear-gradient(180deg,#fff 20%,#8fd0ff 65%,#3d9bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #04122e) drop-shadow(0 0 16px rgba(47,140,255,.6))}
h2{font-weight:800;letter-spacing:.2px}
h2::before{content:"";display:inline-block;width:6px;height:1em;margin-right:9px;vertical-align:-2px;border-radius:2px;transform:skewX(-18deg);background:linear-gradient(#fff,#2f8cff);box-shadow:0 0 10px #2f8cff}
.v{font-weight:800}
.bar input{background:rgba(8,16,46,.85);border:1px solid rgba(90,170,255,.3)}
.bar button,.pill{background:linear-gradient(180deg,#2f8cff,#1446c4);box-shadow:0 0 14px rgba(47,140,255,.45);font-weight:700}
nav{background:rgba(5,10,34,.88);border:1px solid rgba(90,170,255,.32);box-shadow:0 0 26px rgba(47,140,255,.28),0 8px 30px #0009}
nav button.on{background:linear-gradient(180deg,#2f8cff,#1446c4);color:#fff;box-shadow:0 0 16px rgba(47,140,255,.65)}
.day{border-bottom-color:rgba(90,170,255,.16)}
.rng i{background:linear-gradient(90deg,#2f8cff,#a8e4ff)}
.h .p{color:#6fd0ff}
#flash{position:fixed;inset:0;background:radial-gradient(70% 50% at 70% 0,#d6ecff,rgba(120,180,255,.18));opacity:0;transition:opacity .08s;pointer-events:none;z-index:2}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const OWM_KEY="";
const WC={0:["☀️","Ciel dégagé"],1:["🌤️","Plutôt dégagé"],2:["⛅","Partiellement nuageux"],3:["☁️","Couvert"],45:["🌫️","Brouillard"],48:["🌫️","Brouillard givrant"],51:["🌦️","Bruine légère"],53:["🌦️","Bruine"],55:["🌧️","Bruine dense"],56:["🌧️","Bruine verglaçante"],57:["🌧️","Bruine verglaçante"],61:["🌧️","Pluie faible"],63:["🌧️","Pluie"],65:["🌧️","Forte pluie"],66:["🌧️","Pluie verglaçante"],67:["🌧️","Pluie verglaçante"],71:["🌨️","Neige faible"],73:["🌨️","Neige"],75:["❄️","Forte neige"],77:["🌨️","Grains de neige"],80:["🌦️","Averses"],81:["🌦️","Averses"],82:["⛈️","Fortes averses"],85:["🌨️","Averses de neige"],86:["🌨️","Averses de neige"],95:["⛈️","Orage"],96:["⛈️","Orage et grêle"],99:["⛈️","Orage violent"]};
const wc=(c,d=1)=>{const w=WC[c]||["🌡️","—"];if(d)return w;if(c<2)return["🌙",w[1]];if([51,80,81].includes(c))return["🌧️",w[1]];return w};
const dir=d=>["N","NE","E","SE","S","SO","O","NO"][Math.round(d/45)%8];
const r0=x=>Math.round(x);
let pos=null,home=null;
try{pos=JSON.parse(localStorage.getItem("pos"))}catch(e){}

/* Ambiance : ciel, étoiles, pluie, neige */
let FX="none",P=[],raf;
const cv=$("#fx"),cx=cv.getContext("2d"),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
function sky(code,day){
  let s=day?["#1457c8","#071a4d"]:["#030818","#0b1b52"];FX=day?"none":"stars";
  if(code===2)s=day?["#41598a","#1a2748"]:["#0a1030","#1a2447"];
  if(code===3){s=day?["#41598a","#1a2748"]:["#0a1030","#1a2447"];FX="none"}
  if(code===45||code===48){s=day?["#59657d","#262e45"]:["#1a2036","#12182c"];FX="none"}
  if((code>=51&&code<=67)||(code>=80&&code<=82)){s=day?["#2c3f6b","#111b3f"]:["#0a1230","#0c1535"];FX="rain"}
  if((code>=71&&code<=77)||code===85||code===86){s=day?["#5a6f98","#1f2d52"]:["#16204a","#0d1535"];FX="snow"}
  if(code>=95){s=["#16224a","#04081c"];FX="rain"}
  const st=document.documentElement.style;st.setProperty("--s1",s[0]);st.setProperty("--s2",s[1]);st.setProperty("--ac",code>=95?"#9fd8ff":FX==="rain"?"#4db8ff":FX==="snow"?"#d4ecff":day?"#4aa8ff":"#5aa9ff");
  document.querySelector("meta[name=theme-color]").content=s[0];
  initFx();flash(code>=95);
}
let ft;
function flash(on){
  clearTimeout(ft);if(!on||RM)return;
  const f=$("#flash"),go=()=>{ft=setTimeout(()=>{f.style.opacity=.5;setTimeout(()=>f.style.opacity=0,80);setTimeout(()=>{f.style.opacity=.28;setTimeout(()=>f.style.opacity=0,60)},180);go()},4000+Math.random()*7000)};go();
}
function initFx(){
  cancelAnimationFrame(raf);const W=cv.width=innerWidth,H=cv.height=innerHeight;cx.clearRect(0,0,W,H);
  if(FX==="none"||RM)return;
  const n=FX==="rain"?90:FX==="snow"?70:80;
  P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,v:FX==="rain"?9+Math.random()*7:.6+Math.random()*1.2,r:FX==="snow"?1+Math.random()*2.2:Math.random()*1.4+.3,t:Math.random()*6}));
  const loop=()=>{
    cx.clearRect(0,0,W,H);
    for(const p of P){
      if(FX==="rain"){cx.strokeStyle="rgba(170,200,255,.45)";cx.lineWidth=1.2;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-2,p.y+12);cx.stroke();p.y+=p.v;p.x-=.6}
      else if(FX==="snow"){cx.fillStyle="rgba(255,255,255,.8)";cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();p.y+=p.v;p.t+=.02;p.x+=Math.sin(p.t)*.5}
      else{p.t+=.03;cx.fillStyle=`rgba(255,255,255,${.35+.4*Math.sin(p.t)})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
      if(p.y>H){p.y=-10;p.x=Math.random()*W}
    }
    raf=requestAnimationFrame(loop);
  };loop();
}
addEventListener("resize",initFx);
function moon(){
  const M=29.530588853,f=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)%M+M)%M/M,i=Math.round(f*8)%8;
  return{e:["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"][i],n:["Nouvelle lune","Premier croissant","Premier quartier","Lune gibbeuse croissante","Pleine lune","Lune gibbeuse décroissante","Dernier quartier","Dernier croissant"][i],p:r0((1-Math.cos(2*Math.PI*f))/2*100)};
}

/* Navigation */
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,.tab").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");$("#t-"+b.dataset.t).classList.add("on");
  if(b.dataset.t==="map")initMap();
  window.scrollTo(0,0);
});

/* Notifications en arrière-plan (Capacitor) */
const CP=(window.Capacitor&&Capacitor.Plugins)||{};
function savePos(){
  try{if(CP.BackgroundRunner&&home)CP.BackgroundRunner.dispatchEvent({label:"com.moi.atmoz.check",event:"savePos",details:{lat:home.lat,lon:home.lon,name:home.name}})}catch(e){}
}
async function notif(test){
  const LN=CP.LocalNotifications,st=$("#nstat");
  if(!LN){st.textContent="Disponible uniquement dans l’application Android installée.";return}
  try{
    const p=await LN.requestPermissions();
    if(p.display!=="granted"){st.textContent="Notifications refusées : autorisez-les dans les réglages Android de l’app.";return}
    savePos();
    if(test)await LN.schedule({notifications:[{id:1,title:"✅ Atmoz",body:"Les alertes orage, pluie et neige sont actives.",schedule:{at:new Date(Date.now()+1500)}}]});
    st.textContent="Alertes actives : vérification environ toutes les 15 min, app fermée.";
  }catch(e){st.textContent="Erreur : "+(e.message||e)}
}
$("#nOn").onclick=()=>notif(false);$("#nTest").onclick=()=>notif(true);

/* Position */
function locate(){
  $("#place").textContent="Localisation…";
  if(!navigator.geolocation)return fallback();
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=p.coords.latitude,lon=p.coords.longitude;
    pos={lat,lon,name:"Ma position"};home=pos;
    try{
      const j=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=fr&lat=${lat}&lon=${lon}`)).json();
      const a=j.address||{};pos.name=a.city||a.town||a.village||a.municipality||j.name||"Ma position";
    }catch(e){}
    save();load();savePos();
  },fallback,{timeout:10000,maximumAge:300000});
}
function fallback(){
  if(!pos)pos={lat:48.8566,lon:2.3522,name:"Paris"};
  load();
}
function save(){try{localStorage.setItem("pos",JSON.stringify(pos))}catch(e){}}
async function search(){
  const q=$("#q").value.trim();if(!q)return;
  try{
    const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=${encodeURIComponent(q)}`)).json();
    if(!j.results)return $("#upd").textContent="Ville introuvable.";
    const r=j.results[0];pos={lat:r.latitude,lon:r.longitude,name:r.name};
    $("#q").value="";save();load();
  }catch(e){$("#upd").textContent="Recherche impossible. Vérifiez la connexion."}
}
$("#go").onclick=search;$("#q").onkeydown=e=>{if(e.key==="Enter")search()};$("#loc").onclick=locate;

/* Données météo */
let W=null;
async function load(){
  if(!pos)return locate();
  const u="https://api.open-meteo.com/v1/forecast?latitude="+pos.lat+"&longitude="+pos.lon+
  "&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m"+
  "&hourly=temperature_2m,precipitation_probability,weather_code,is_day,wind_gusts_10m,visibility,uv_index"+
  "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,wind_gusts_10m_max,uv_index_max"+
  "&timezone=auto&forecast_days=7&wind_speed_unit=kmh";
  try{
    W=await (await fetch(u)).json();
    render();
    $("#upd").textContent="Mis à jour à "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){$("#upd").textContent="Hors ligne : impossible d’actualiser."}
}
function render(){
  const c=W.current,h=W.hourly,d=W.daily;
  const [ic,tx]=wc(c.weather_code,c.is_day);sky(c.weather_code,c.is_day);
  $("#place").textContent=pos.name;$("#ico").textContent=ic;
  $("#temp").textContent=r0(c.temperature_2m)+"°";$("#desc").textContent=tx;
  $("#mm").textContent=`Ressenti ${r0(c.apparent_temperature)}° · Max ${r0(d.temperature_2m_max[0])}° · Min ${r0(d.temperature_2m_min[0])}°`;
  const card=(k,v,s)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}${s?` <small>${s}</small>`:""}</div></div>`;
  $("#quick").innerHTML=card("💨 Vent",r0(c.wind_speed_10m),"km/h "+dir(c.wind_direction_10m))+card("💧 Humidité",c.relative_humidity_2m,"%")+card("🌧️ Pluie",d.precipitation_probability_max[0],"% aujourd’hui")+card("🌅 Soleil",d.sunrise[0].slice(11,16),"→ "+d.sunset[0].slice(11,16));
  /* heure par heure */
  const i0=Math.max(0,h.time.findIndex(t=>t>=c.time.slice(0,13)+":00"));
  $("#hours").innerHTML=h.time.slice(i0,i0+24).map((t,k)=>{const j=i0+k;return `<div class="h"><div class="mut">${k?t.slice(11,13)+"h":"Auj."}</div><div class="e">${wc(h.weather_code[j],h.is_day[j])[0]}</div><b>${r0(h.temperature_2m[j])}°</b><div class="p">${h.precipitation_probability[j]??0}%</div></div>`}).join("");
  const T=h.temperature_2m.slice(i0,i0+24),ta=Math.min(...T),tb=Math.max(...T);
  const pts=T.map((v,k)=>`${(k/23*300).toFixed(1)},${(60-(v-ta)/(tb-ta||1)*50).toFixed(1)}`).join(" ");
  $("#spark").innerHTML=`<div class="k" style="margin-bottom:6px">Température sur 24 h</div><svg viewBox="0 0 300 70" width="100%" height="90" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9ff" stop-opacity=".5"/><stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/></linearGradient></defs><polygon points="0,70 ${pts} 300,70" fill="url(#g)"/><polyline points="${pts}" fill="none" stroke="#9fd0ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg><div class="row sp mut"><span>${r0(ta)}°</span><span>maintenant → +24 h</span><span>${r0(tb)}°</span></div>`;
  /* 7 jours */
  const mn=Math.min(...d.temperature_2m_min),mx=Math.max(...d.temperature_2m_max);
  $("#days").innerHTML=d.time.map((t,i)=>{
    const nm=i?new Date(t+"T12:00").toLocaleDateString("fr-FR",{weekday:"long"}):"Aujourd’hui";
    const l=(d.temperature_2m_min[i]-mn)/(mx-mn||1)*60,w=(d.temperature_2m_max[i]-d.temperature_2m_min[i])/(mx-mn||1)*60+8;
    return `<div class="day"><span style="text-transform:capitalize">${nm}</span><span style="font-size:1.5rem">${wc(d.weather_code[i])[0]}</span><span class="mut">💧${d.precipitation_probability_max[i]??0}%</span><div class="rng">${r0(d.temperature_2m_min[i])}°<i style="max-width:${w}%;margin-left:${l*0.3}%"></i>${r0(d.temperature_2m_max[i])}°</div></div>`}).join("");
  /* détails */
  const vis=h.visibility[i0]!=null?(h.visibility[i0]/1000).toFixed(1):"—";
  const card2=(k,v,s)=>card(k,v,s);
  $("#det").innerHTML=[
    card2("🌡️ Ressenti",r0(c.apparent_temperature)+"°",""),
    card2("💧 Humidité",c.relative_humidity_2m,"%"),
    card2("💨 Vent",r0(c.wind_speed_10m),"km/h "+dir(c.wind_direction_10m)),
    card2("🌬️ Rafales",r0(c.wind_gusts_10m),"km/h"),
    card2("🧭 Pression",r0(c.pressure_msl),"hPa"),
    card2("☁️ Nuages",c.cloud_cover,"%"),
    card2("🌧️ Précip.",c.precipitation,"mm"),
    card2("👁️ Visibilité",vis,"km"),
    card2("☀️ Indice UV",(d.uv_index_max[0]??0).toFixed(0),"max"),
    card2("🌅 Lever",d.sunrise[0].slice(11,16),""),
    card2("🌇 Coucher",d.sunset[0].slice(11,16),""),
    card2("🌙 "+moon().n,moon().e+" "+moon().p,"% éclairée")
  ].join("");
  alerts();
  if(map)map.setView([pos.lat,pos.lon],map.getZoom());
}

/* Alertes (calculées à partir des prévisions des 48 h) */
function alerts(){
  const h=W.hourly,d=W.daily,A=[];
  const n=48,g=Math.max(...h.wind_gusts_10m.slice(0,n)),tM=Math.max(...h.temperature_2m.slice(0,n)),tm=Math.min(...h.temperature_2m.slice(0,n));
  const codes=h.weather_code.slice(0,n),uv=Math.max(...h.uv_index.slice(0,n).map(x=>x||0));
  const add=(lv,e,t,s)=>A.push({lv,e,t,s});
  if(g>=100)add("r","🌪️","Tempête",`Rafales jusqu’à ${r0(g)} km/h.`);else if(g>=70)add("r","💨","Vent violent",`Rafales jusqu’à ${r0(g)} km/h.`);else if(g>=50)add("w","💨","Vent fort",`Rafales jusqu’à ${r0(g)} km/h.`);
  if(codes.some(x=>x>=95))add("r","⛈️","Orages",`Orages prévus dans les 48 h.`);
  if(codes.some(x=>[66,67].includes(x)))add("r","🧊","Pluie verglaçante","Routes glissantes possibles.");
  if(codes.some(x=>[75,86].includes(x)))add("w","❄️","Forte neige","Chutes de neige importantes prévues.");
  const p=Math.max(...d.precipitation_sum.slice(0,2));
  if(p>=50)add("r","🌧️","Pluies intenses",`Jusqu’à ${r0(p)} mm en une journée.`);else if(p>=20)add("w","🌧️","Fortes pluies",`Jusqu’à ${r0(p)} mm en une journée.`);
  if(tM>=40)add("r","🥵","Canicule",`Jusqu’à ${r0(tM)}°.`);else if(tM>=34)add("w","🌡️","Fortes chaleurs",`Jusqu’à ${r0(tM)}°.`);
  if(tm<=-10)add("r","🥶","Froid intense",`Jusqu’à ${r0(tm)}°.`);else if(tm<=-3)add("w","❄️","Gel",`Minimum ${r0(tm)}°.`);
  if(uv>=8)add("w","🕶️","UV très élevés",`Indice UV ${r0(uv)}.`);
  if(Math.min(...h.visibility.slice(0,n).filter(x=>x!=null))<500)add("w","🌫️","Brouillard dense","Visibilité réduite sous 500 m.");
  $("#alerts").innerHTML=A.length?A.map(a=>`<div class="card al ${a.lv}"><div class="e">${a.e}</div><div><b>${a.t}</b><div class="mut">${a.s}</div></div></div>`).join("")
   :`<div class="card al i"><div class="e">✅</div><div><b>Aucune alerte</b><div class="mut">Pas de phénomène marquant prévu dans les 48 h.</div></div></div>`;
  $("#alerts").insertAdjacentHTML("beforeend",`<p class="mut" style="text-align:center">Alertes calculées d’après les prévisions Open-Meteo. Elles ne remplacent pas les vigilances officielles.</p>`);
  const b=$("#banner");
  if(A.length){b.style.display="block";b.textContent=A[0].e+" "+A[0].t+" — "+A[0].s+(A.length>1?` (+${A.length-1})`:"")}else b.style.display="none";
}

/* Radar */
const ES="https://server.arcgisonline.com/ArcGIS/rest/services/";
const BASE={
  dark:{n:"🌙 Sombre",u:ES+"Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",l:ES+"Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",z:16},
  street:{n:"🗺️ Plan",u:ES+"World_Street_Map/MapServer/tile/{z}/{y}/{x}",z:19},
  sat:{n:"🛰️ Satellite",u:ES+"World_Imagery/MapServer/tile/{z}/{y}/{x}",l:ES+"Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",z:19}
};
let bk="dark",bl=[];
function setBase(k){
  bk=k;bl.forEach(x=>map.removeLayer(x));bl=[];const b=BASE[k];
  bl.push(L.tileLayer(b.u,{maxNativeZoom:b.z,maxZoom:12}).addTo(map).bringToBack());
  if(b.l)bl.push(L.tileLayer(b.l,{pane:"lab",maxNativeZoom:b.z,maxZoom:12}).addTo(map));
  $("#bm").textContent=b.n;try{localStorage.setItem("bk",k)}catch(e){}
}
let map=null,frames=[],layers=[],fi=0,timer=null,playing=true;
async function initMap(){
  if(map){setTimeout(()=>map.invalidateSize(),50);return}
  map=L.map("map",{zoomControl:false,attributionControl:false}).setView([pos.lat,pos.lon],6);
  map.createPane("lab").style.zIndex=250;map.getPane("lab").style.pointerEvents="none";
  let k0="dark";try{k0=localStorage.getItem("bk")||"dark"}catch(e){}
  setBase(BASE[k0]?k0:"dark");
  L.circleMarker([pos.lat,pos.lon],{radius:6,color:"#fff",fillColor:"#5aa9ff",fillOpacity:1}).addTo(map);
  if(OWM_KEY){
    const LY=[["precipitation_new","🌧️ Pluie"],["clouds_new","☁️ Nuages"],["wind_new","💨 Vent"],["temp_new","🌡️ Temp."],["pressure_new","🧭 Pression"]];
    let cur=null;
    const set=k=>{if(cur)map.removeLayer(cur);cur=L.tileLayer(`https://tile.openweathermap.org/map/${k}/{z}/{x}/{y}.png?appid=${OWM_KEY}`,{opacity:.8,maxZoom:10}).addTo(map);document.querySelectorAll("#lay button").forEach(b=>b.style.background=b.dataset.k===k?"var(--ac)":"")};
    $("#lay").innerHTML=LY.map(([k,n])=>`<button class="pill" data-k="${k}" style="flex:0 0 auto">${n}</button>`).join("");
    $("#lay").style.display="flex";
    $("#lay").querySelectorAll("button").forEach(b=>b.onclick=()=>set(b.dataset.k));
    set("precipitation_new");$("#play").style.display="none";$("#rt").textContent="Données OpenWeatherMap";
    return;
  }
  try{
    const j=await (await fetch("https://api.rainviewer.com/public/weather-maps.json")).json();
    frames=[...j.radar.past,...(j.radar.nowcast||[])];
    layers=frames.map(f=>L.tileLayer(j.host+f.path+"/256/{z}/{x}/{y}/2/1_1.png",{opacity:0,maxNativeZoom:7,maxZoom:10}).addTo(map));
    fi=Math.max(0,j.radar.past.length-1);show();play();
  }catch(e){$("#rt").textContent="Radar indisponible. Vérifiez la connexion."}
}
function show(){
  layers.forEach((l,i)=>l.setOpacity(i===fi?.7:0));
  const t=new Date(frames[fi].time*1000).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  $("#rt").textContent=t+(frames[fi].time*1000>Date.now()?" · prévision":" · observé");
}
function play(){clearInterval(timer);timer=setInterval(()=>{fi=(fi+1)%frames.length;show()},700);playing=true;$("#play").textContent="⏸"}
$("#bm").onclick=()=>{if(!map)return;const ks=Object.keys(BASE);setBase(ks[(ks.indexOf(bk)+1)%ks.length])};
$("#play").onclick=()=>{if(playing){clearInterval(timer);playing=false;$("#play").textContent="▶️"}else play()};

/* Actualisation automatique */
setInterval(load,10*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
pos?load():locate();
if(pos)locate();
</script>
